[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim-gym"
version = "0.3.0"
description = "Rocket League-style soccar as a Gymnasium env, on RocketSim physics and a homemade arena."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yann Harel" }]
dependencies = [
    "gymnasium",
    "numpy",
    # RocketSim ships wheels only, for these platforms; on a Mac it needs macOS 14 or later.
    "rocketsim==2.2.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "moderngl",
    # The play window (rocketsim-play).
    "pygame-ce",
]

[project.scripts]
rocketsim-play = "rocketsim_gym.play:main"
rocketsim-server = "rocketsim_gym.lan.server:main"

[project.urls]
Repository = "https://github.com/hyruuk/rocketsim-gym"

[tool.setuptools]
packages = ["rocketsim_gym", "rocketsim_gym.lan"]

[tool.setuptools.package-data]
rocketsim_gym = ["collision_meshes/*/soccar/*.cmf", "collision_meshes/*/manifest.json",
                 "fonts/*.ttf", "fonts/OFL.txt"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default set, written out so a machine with a ruff config of its own checks the same rules.
select = ["E4", "E7", "E9", "F"]
