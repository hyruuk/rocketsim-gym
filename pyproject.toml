[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim-gym"
version = "0.1.0"
description = "Rocket League-style soccar as a Gymnasium env, on RocketSim physics and a homemade arena."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "numpy",
    # RocketSim ships wheels only, for these platforms; on a Mac it needs macOS 14 or later.
    "rocketsim==2.2.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "moderngl",
]

[tool.setuptools]
packages = ["rocketsim_gym"]

[tool.setuptools.package-data]
rocketsim_gym = ["collision_meshes/*/soccar/*.cmf", "collision_meshes/*/manifest.json"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's default set, written out so a machine with a ruff config of its own checks the same rules.
select = ["E4", "E7", "E9", "F"]
